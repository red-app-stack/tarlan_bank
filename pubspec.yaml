name: tarlan_bank
description: "Cross-platform banking companion app built with Flutter."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  # Flutter 3.50 / Dart 3.14 (latest stable in this environment). Raised from
  # the old ^3.5.3 floor (Flutter 3.24 era) so google_sign_in 7.x can resolve.
  sdk: ^3.14.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 9.2.4
  flutter_svg: any
  # bcrypt: any
  # collection: any
  # cupertino_icons: any
  dio: any
  # encrypt: any
  intl: any
  shared_preferences: any
  url_launcher: ^6.3.3 # Call us -> tel: dialer
  shimmer: any
  local_auth: any
  flutter_native_contact_picker: 0.0.13
  permission_handler: any
  local_auth_darwin: any
  local_auth_android: any
  curved_labeled_navigation_bar: any
  flutter_dotenv: any
  crypto: any
  card_swiper: any
  mobile_scanner: 7.5.0
  pretty_qr_code: any
  image_picker: any
  # Face verification (checklist 1.1): live preview + on-device ML Kit face
  # detection driving our own active-liveness challenges.
  camera: ^0.12.2
  google_mlkit_face_detection: ^1.0.3
  # photo_view: any
  # graphview: any
  syncfusion_flutter_datepicker: any
  # chat_bubbles: any
  # path_provider: any
  uuid: ^4.5.2
  material_ui: ^1.11.1
  liquid_glass_easy: ^5.2.0
  cupertino_ui: ^1.1.7
  # Migration: state management + navigation (GetX -> Riverpod + go_router).
  flutter_riverpod: ^3.3.1
  app_links: ^7.2.2 # Firebase email-verification App Links (oobCode)
  go_router: ^17.3.0
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0 # Core 5.x generation; 16.x needs core 4.x
  flutter_local_notifications: ^21.0.0 # foreground notification display
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  # 7.2.0 current stable; requires Dart ^3.7, satisfied by the new ^3.14 floor.
  # Android reads the web client id from google-services.json automatically.
  google_sign_in: ^7.2.0
  cached_network_image: ^4.0.7
  # flutter_markdown: ^0.7.7+1
dev_dependencies:
  flutter_lints: any
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true # lib/l10n/*.arb -> lib/generated/app_localizations.dart
  assets:
    - .env
    - assets/images/
    - assets/images/accent_image_1.png
    - assets/images/accent_image_2.png
    - assets/images/accent_image_3.png
    - assets/images/accent_image_4.png
    - assets/icons/
    - assets/icons/action/
    - assets/icons/brand/
    - assets/icons/button/
    - assets/icons/chat/
    - assets/icons/shell/
    - assets/icons/scan/
    - assets/icons/widget/
  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans-ExtraBold.ttf
          weight: 800
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
